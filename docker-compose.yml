services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gistag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gistag}
      POSTGRES_DB: ${POSTGRES_DB:-gistag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-gistag}:${POSTGRES_PASSWORD:-gistag}@postgres:5432/${POSTGRES_DB:-gistag}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
